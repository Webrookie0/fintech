<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="780" fill="#ffffff"/>

  <!-- ============ UNTRUSTED ZONE ============ -->
  <rect x="30" y="20" width="900" height="120" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="6 4"/>
  <text x="46" y="42" font-size="12" font-weight="700" fill="#b91c1c" letter-spacing="1.5">UNTRUSTED ZONE</text>
  <rect x="300" y="52" width="360" height="62" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="480" y="77" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Autonomous Agent</text>
  <text x="480" y="97" text-anchor="middle" font-size="11.5" fill="#6b7280">big model · plans, codes, proposes actions · assumed compromisable</text>

  <!-- ============ GUARDIAN ZONE ============ -->
  <rect x="30" y="160" width="900" height="330" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="6 4"/>
  <text x="46" y="182" font-size="12" font-weight="700" fill="#1d4ed8" letter-spacing="1.5">GUARDIAN — THE TRUSTED LAYER</text>

  <!-- decision diamond -->
  <polygon points="480,240 590,310 480,380 370,310" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="480" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">Guardian</text>
  <text x="480" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">/api/request</text>
  <text x="480" y="334" text-anchor="middle" font-size="11" fill="#0369a1">combine + decide</text>

  <!-- Judge box (left) -->
  <rect x="70" y="300" width="180" height="64" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="160" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">Judge</text>
  <text x="160" y="344" text-anchor="middle" font-size="10.5" fill="#a16207">small (newer) LLM</text>
  <text x="160" y="358" text-anchor="middle" font-size="10.5" fill="#a16207">advisory · never binds</text>

  <!-- Policy box (right) -->
  <rect x="710" y="300" width="190" height="64" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="805" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Policy Engine</text>
  <text x="805" y="344" text-anchor="middle" font-size="10.5" fill="#15803d">deterministic · hard gate</text>
  <text x="805" y="358" text-anchor="middle" font-size="10.5" fill="#15803d">budget · allowlist · caps</text>

  <!-- Loop detector box (bottom-left) -->
  <rect x="70" y="440" width="180" height="40" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="160" y="464" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b21a8">Loop Detector</text>

  <!-- arrows into diamond -->
  <path d="M 480 114 L 480 238" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="492" y="180" font-size="11" fill="#334155">1 · transaction intent</text>

  <path d="M 252 332 L 368 318" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="285" y="314" font-size="10.5" fill="#a16207">2 · advisory review</text>

  <path d="M 708 332 L 592 318" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="632" y="314" font-size="10.5" fill="#15803d">3 · hard gate</text>

  <path d="M 252 460 L 380 396" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="250" y="426" font-size="10.5" fill="#9333ea">stall / loop signals</text>

  <!-- ============ ENFORCEMENT ZONE ============ -->
  <rect x="30" y="510" width="900" height="250" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-dasharray="6 4"/>
  <text x="46" y="532" font-size="12" font-weight="700" fill="#15803d" letter-spacing="1.5">ENFORCEMENT ZONE</text>

  <!-- Wallet box -->
  <rect x="360" y="552" width="240" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="578" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Wallet</text>
  <text x="480" y="596" text-anchor="middle" font-size="11" fill="#374151">re-checks everything itself</text>
  <text x="480" y="610" text-anchor="middle" font-size="11" fill="#374151">allowlist · caps · kill switch</text>

  <!-- approve arrow -->
  <path d="M 480 382 L 480 550" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="492" y="470" font-size="11" font-weight="700" fill="#15803d">approved</text>

  <!-- reject arrow -->
  <path d="M 370 310 L 300 310 L 300 120" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="185" y="220" font-size="11" fill="#dc2626">rejected → audit trail</text>

  <!-- result back to agent -->
  <path d="M 480 622 L 480 640 L 150 640 L 150 130" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="158" y="600" font-size="10.5" fill="#334155">executed / refused</text>

  <!-- bypass path -->
  <path d="M 300 83 L 190 83 L 190 640 L 358 640" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#arrR)"/>
  <text x="52" y="100" font-size="10.5" fill="#dc2626">bypass: direct call + forged token</text>

  <!-- legend -->
  <rect x="640" y="660" width="280" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="656" y="682" font-size="11" font-weight="700" fill="#334155">Legend</text>
  <path d="M 656 698 L 700 698" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><text x="710" y="702" font-size="10.5" fill="#475569">decision flow</text>
  <path d="M 656 720 L 700 720" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/><text x="710" y="724" font-size="10.5" fill="#475569">forged / rejected path</text>
</svg>
