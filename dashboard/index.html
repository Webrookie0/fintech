  <div id="view"></div>

<aside id="dock">

    <p class="hint">Run scripted beats and watch the enforcement layer work live. Every action lands in the audit trail.</p>

    <button id="btn-kill" class="btn danger">Kill switch ON</button>
    <button id="btn-unkill" class="btn ok">Release kill switch</button>
    <button id="btn-reset" class="btn ghost">Reset demo</button>
    <div id="admin-row" hidden><input id="admin-token" placeholder="admin token" autocomplete="off"><button id="btn-save-token" class="btn ghost">set</button></div>
  </div>
