# Render blueprint — deploy "Guardian" as a free web service.
# Push this repo to GitHub, then in Render: New → Blueprint → select repo.
# Or manually: New Web Service → repo → Runtime: Docker.
services:
  - type: web
    name: guardian
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      # PORT is injected by Render itself (the Dockerfile honors ${PORT}).
      # SET THIS before first deploy: opens a browser and edit → Environment,
      # or use a value unique to your team. Guards the kill switch + demo buttons.
      - key: GUARDIAN_ADMIN_TOKEN
        value: demo
      # Supervision mode: enforce | watch | ask.
      #   watch   = NEVER blocks tools, only toasts (safe default)
      #   enforce = paused/terminated sessions block spendy tools (strict)
      #   ask     = blocks on pause, but "Allow session" on the dashboard opens
      #             the gate until the owner closes it
      - key: GUARDIAN_MODE
        value: watch
      # Bulletproof escape hatch: GUARDIAN_BYPASS=1 makes the opencode plugin a
      # no-op on its next start. Set it only if you feel locked out.
      - key: GUARDIAN_BYPASS
        sync: false
      # Optional: free-tier LLM keys. The judge degrades to a deterministic
      # heuristic if none are present, so the demo works without them.
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
